<mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <div>
        <button mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon">
            <mat-icon>menu</mat-icon>
        </button>
        <span>Welcome {{ userService.userData?.username }}</span>
    </div>
    <div class="btn-div" fxLayout="row" fxLayoutAlign="space-between center">
        <button (click)="gotoSettings()" mat-icon-button class=" example-icon favorite-icon"
            aria-label="Example icon-button with heart icon">
            Settings
        </button>
        <button (click)="logout()" mat-icon-button class="pr-60 example-icon favorite-icon"
            aria-label="Example icon-button with heart icon">
            Logout
        </button>

    </div>

</mat-toolbar>
