

<div  fxLayout="row" fxLayoutAlign="space-between center" >
  <div fxFlex="60">
    <img class="img" src="https://source.unsplash.com/random" alt="https://source.unsplash.com/random">
  </div>

  <div fxLayout="column" fxFlex="40">
    <form fxLayout="column" fxFlex="100" fxLayoutAlign="space-between center" [formGroup]="signupForm" class="signup4-form mat-bg-card" (ngSubmit)="onSubmit()">
      
      <mat-icon aria-hidden="false" class="mb-16 p-icon" aria-label="Example home icon">person</mat-icon>
      <h2>Sign Up</h2>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          formControlName="email"
          type="email"
          name="email"
          placeholder="Email"
        />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Username</mat-label>
        <input
          matInput
          formControlName="username"
          type="text"
          name="username"
          placeholder="Username"
        />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>First Name</mat-label>
        <input
          matInput
          formControlName="firstName"
          type="text"
          name="firstName"
          placeholder="firstName"
        />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>LastName</mat-label>
        <input
          matInput
          formControlName="lastName"
          type="text"
          name="LastName"
          placeholder="LastName"
        />
      </mat-form-field>

      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          formControlName="password"
          type="password"
          name="password"
          placeholder="********"
        />
      </mat-form-field>
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Comfirm Password</mat-label>
        <input
          matInput
          formControlName="passwordAgain"
          type="password"
          name="password"
          placeholder="********"
        />
      </mat-form-field>

      <mat-checkbox formControlName="agreed"
      >I agree with terms and condtions</mat-checkbox
    >
    <mat-error *ngIf="userService.error"> {{ userService.error }} </mat-error>
    <div fxLayout="row wrap" fxLayoutAlign="start center" style="margin-top: 20px;">
      <button [disabled]="signupForm.invalid && !signupForm.value.agreed"  mat-flat-button color="primary">Sign Up</button>
      <span class="px-16">or</span>
      <a class="font-weight-bold mat-color-primary" routerLink="/">Sign In</a>
    </div>

    <!-- <div fxLayout="row wrap" fxLayoutAlign="space-between center" style="margin-top: 20px">
        <span>or connect with </span>
        <div>
          icons goes here
        </div>
      </div> -->

  </form>
 
  </div>

</div>
